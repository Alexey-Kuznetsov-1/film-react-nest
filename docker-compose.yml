services:
  postgres:
    image: postgres:15-alpine
    container_name: film-postgres
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - film-network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: film-pgadmin
    env_file:
      - .env
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "8080:80"
    networks:
      - film-network
    depends_on:
      - postgres
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ghcr.io/alexey-kuznetsov-1/film-react-nest/film-backend:latest
    container_name: film-backend
    env_file:
      - .env
    ports:
      - "3000:3000"
    networks:
      - film-network
    depends_on:
      - postgres
    volumes:
      - ./backend/public:/app/public
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ghcr.io/alexey-kuznetsov-1/film-react-nest/film-frontend:latest
    container_name: film-frontend
    ports:
      - "80:80"
    networks:
      - film-network
    depends_on:
      - backend
    restart: unless-stopped